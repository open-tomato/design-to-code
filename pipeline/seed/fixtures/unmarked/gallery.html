<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Unmarked fixture gallery</title>
    <style>
      .grid { display: flex; gap: 12px; }
      .card { border: 1px solid #ccc; padding: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1 class="gallery-title">Gallery</h1>
      <button class="filter" type="button">All prints</button>
      <div class="grid">
        <article class="card">
          <h2 class="card-title">Harbour</h2>
          <p class="card-text">A harbour at dawn.</p>
        </article>
        <article class="card">
          <h2 class="card-title">Forest</h2>
          <p class="card-text">A forest in fog.</p>
        </article>
        <article class="card">
          <h2 class="card-title">Dunes</h2>
          <p class="card-text">Dunes at noon.</p>
        </article>
      </div>
    </main>
  </body>
</html>
